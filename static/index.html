<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cold DM Writer</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: #2a2a38;
      --accent: #f59e0b;
      --accent2: #fbbf24;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --success: #10b981;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 20%, rgba(245,158,11,0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(245,158,11,0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .header {
      margin-bottom: 40px;
      animation: fadeDown 0.6s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease infinite;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-top: 10px;
      font-weight: 400;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease both;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    label span { color: var(--accent); margin-left: 2px; }

    input, textarea, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
      -webkit-appearance: none;
    }

    textarea { resize: vertical; min-height: 90px; }
    input::placeholder, textarea::placeholder { color: var(--muted); }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
    }

    select option { background: var(--surface2); }

    .btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent2);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(245,158,11,0.3);
    }

    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .loading { display: none; text-align: center; padding: 40px; color: var(--muted); }
    .loading.active { display: block; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .loading-text { font-size: 14px; animation: blink 1.5s ease infinite; }

    .results { display: none; }
    .results.active { display: block; animation: fadeUp 0.5s ease both; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .count-badge {
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
    }

    .dm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    .dm-card:hover { border-color: rgba(245,158,11,0.3); }

    .dm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .dm-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(245,158,11,0.08);
      padding: 4px 10px;
      border-radius: 100px;
    }

    .copy-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    .dm-message {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }

    .error-box {
      display: none;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: var(--error);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      margin-top: 12px;
    }

    .error-box.active { display: block; }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
      margin: 20px auto 0;
    }

    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dm-card:nth-child(1) { animation-delay: 0.05s; }
    .dm-card:nth-child(2) { animation-delay: 0.10s; }
    .dm-card:nth-child(3) { animation-delay: 0.15s; }
    .dm-card:nth-child(4) { animation-delay: 0.20s; }
    .dm-card:nth-child(5) { animation-delay: 0.25s; }
    .dm-card:nth-child(6) { animation-delay: 0.30s; }
    .dm-card:nth-child(7) { animation-delay: 0.35s; }
    .dm-card:nth-child(8) { animation-delay: 0.40s; }
    .dm-card:nth-child(9) { animation-delay: 0.45s; }
    .dm-card:nth-child(10) { animation-delay: 0.50s; }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .container { padding: 24px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="badge">AI-Powered</div>
      <h1>Cold <span>DM</span> Writer</h1>
      <p class="subtitle">Paste your offer. Pick your target. Get DMs that actually get replies.</p>
    </div>

    <div class="card" id="formCard">
      <div class="card-title">Your Details</div>
      <div class="form-grid">

        <div class="form-group full">
          <label>Your Service / Offer <span>*</span></label>
          <textarea id="service" placeholder="e.g. I do short-form video editing for e-commerce brands. I help them get more views and sales through Reels and TikToks."></textarea>
        </div>

        <div class="form-group full">
          <label>Target Audience <span>*</span></label>
          <textarea id="audience" placeholder="e.g. Shopify store owners who are running ads but not posting organic content. Usually 1-5 person teams." style="min-height:70px;"></textarea>
        </div>

        <div class="form-group">
          <label>Platform</label>
          <select id="platform">
            <option value="Instagram">Instagram</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="Twitter / X">Twitter / X</option>
            <option value="Reddit">Reddit</option>
            <option value="Facebook">Facebook</option>
            <option value="WhatsApp">WhatsApp</option>
          </select>
        </div>

        <div class="form-group">
          <label>Tone</label>
          <select id="tone">
            <option value="Friendly and conversational">Friendly & Casual</option>
            <option value="Professional and confident">Professional</option>
            <option value="Direct and bold">Direct & Bold</option>
            <option value="Curious and low-pressure">Curious & Low-Pressure</option>
            <option value="Witty and punchy">Witty & Punchy</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Goal of the DM</label>
          <input type="text" id="goal" placeholder="e.g. Book a free 15-min call, Get a reply, Send my portfolio link" value="Get a reply and start a conversation"/>
        </div>

      </div>

      <button class="btn" id="generateBtn" onclick="generate()">
        Generate DMs →
      </button>

      <div class="error-box" id="errorBox"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Writing your DMs...</div>
    </div>

    <div class="results" id="results">
      <div class="results-header">
        <div class="results-title">Your DMs</div>
        <div class="count-badge" id="countBadge">0 messages</div>
      </div>
      <div id="dmList"></div>
      <button class="reset-btn" onclick="reset()">← Generate Again</button>
    </div>

  </div>

  <script>
    async function generate() {
      const service = document.getElementById('service').value.trim();
      const audience = document.getElementById('audience').value.trim();
      const platform = document.getElementById('platform').value;
      const tone = document.getElementById('tone').value;
      const goal = document.getElementById('goal').value.trim();
      const errorBox = document.getElementById('errorBox');

      errorBox.classList.remove('active');

      if (!service || !audience) {
        errorBox.textContent = 'Please fill in your service and target audience.';
        errorBox.classList.add('active');
        return;
      }

      document.getElementById('generateBtn').disabled = true;
      document.getElementById('loading').classList.add('active');
      document.getElementById('formCard').style.opacity = '0.4';
      document.getElementById('formCard').style.pointerEvents = 'none';

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ service, audience, platform, tone, goal })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Something went wrong');
        renderResults(data.dms);

      } catch (err) {
        document.getElementById('formCard').style.opacity = '1';
        document.getElementById('formCard').style.pointerEvents = 'auto';
        document.getElementById('generateBtn').disabled = false;
        errorBox.textContent = err.message || 'Failed to generate. Please try again.';
        errorBox.classList.add('active');
      } finally {
        document.getElementById('loading').classList.remove('active');
      }
    }

    function renderResults(dms) {
      const list = document.getElementById('dmList');
      list.innerHTML = '';

      dms.forEach((dm, i) => {
        const card = document.createElement('div');
        card.className = 'dm-card';
        card.innerHTML = `
          <div class="dm-header">
            <div class="dm-label">${dm.label}</div>
            <button class="copy-btn" onclick="copyDM(this, ${i})">Copy</button>
          </div>
          <div class="dm-message" id="dm-${i}">${escapeHtml(dm.message)}</div>
        `;
        list.appendChild(card);
      });

      document.getElementById('countBadge').textContent = `${dms.length} messages`;
      document.getElementById('loading').classList.remove('active');
      document.getElementById('results').classList.add('active');
      document.getElementById('formCard').style.display = 'none';
    }

    function copyDM(btn, index) {
      const text = document.getElementById(`dm-${index}`).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function reset() {
      document.getElementById('results').classList.remove('active');
      document.getElementById('formCard').style.display = 'block';
      document.getElementById('formCard').style.opacity = '1';
      document.getElementById('formCard').style.pointerEvents = 'auto';
      document.getElementById('generateBtn').disabled = false;
      document.getElementById('dmList').innerHTML = '';
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) generate();
    });
  </script>
</body>
</html>
